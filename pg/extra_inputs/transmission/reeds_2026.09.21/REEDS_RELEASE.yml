# Which file and status field (checked at this commit):
# - There is no transmission_capacity_future_*.csv in this release: ReEDS's future transmission comes from
#   reeds/input_processing/transmission.py get_trancap_fut(), which reads inputs/transmission/
#   hvdc_planned-baseline.csv ("Included in all runs") plus hvdc_planned-<GSw_TransScen>.csv (NTP study
#   scenarios, not baseline) and the offshore links.
# - Status field: `certain` (1 = "the line MUST be built at the provided MW capacity in year_online" ->
#   trancap_fut_cat 'certain'; 0 = may be built, 'possible'). AC additions are not listed: ReEDS handles them
#   through the interface transfer limits (itl_NARIS.csv), so its certain future capacity is on its own
#   transfer-capability basis (MW of the line between the two zones).
# - hvdc_existing.csv: the HVDC lines already in service, used to check that nothing certain is already in
#   the 2024 starting capacity.
