# S0 production case build: one settings block that turns on everything the S0 test workflow did by
# hand (s0_workflow/README.md). Code: s0_workflow/production.py and s0_workflow/day_selection.py, called
# from pg_to_switch.py. Inert unless s0_production.enabled, which the `s0_production` column of
# pg/extra_inputs/scenario_inputs.csv sets per case (axis in scenario_management.yml):
#   off          (default for every existing row)
#   on           everything below; fleet-independent days; mode A (myopic chain of single years)
#   on_windows   as `on`, mode B (rolling two-period windows)
#   on_pgdays    LEGACY settings (ATB-only gas capex, the legacy gas-turbine cap, NY RPS buyout only,
#                the current state-policy files)
#                with PowerGenome's k-means days and no chain: the s4x1 2035 regression case
#                (s4x1_S0prod_2035) against the ic_v4 B6+B8 + NY buyout run; builds as before Oct 2026
#   on_pgdays_new  as on_pgdays with the new defaults below (s4x1_S0prod_2035_new)
# Changes to shared code and defaults made for this are listed in SHARED_CHANGES.md.
s0_production:
  enabled: false

  # deep-merged over the case's settings for every model year when enabled
  settings:
    # build-rate central "v2" (the build_rate_*.central.v2 aliases of the test runs: 87729a5 defaults,
    # transreg ceilings for wind and solar, storage national-only)
    build_rate:
      enabled: true
      level: central
      groups: [wind_onshore, solar, storage]
      regional: true
      regional_groups: [wind_onshore, solar]
    # interconnection headroom, atts_s0 (host mode; the ic_v4 inputs of the test runs)
    interconnection_headroom:
      enabled: true
      scenario: atts_s0

  # diagnostic slack on the headroom limit ($/MW; ic_params.ic_v2 of the test runs), so a case that
  # cannot meet the headroom limit solves and reports where (ic_headroom.csv)
  interconnection_slack_cost_per_mw: 5.0e7

  # item 1: representative days, selected per model year (s0_workflow/day_selection.py)
  time_sampling:
    method: fleet_independent      # fleet_independent | powergenome (PowerGenome k-means)
    n_days: 24                     # including the 3 + 3 tail days; plus PowerGenome's peak-load day
    n_top_load_days: 3
    n_low_net_load_days: 3
    tolerances:                    # by transreg and nationally, full-record means
      load_rel: 0.01               # mean load, relative
      wind_cf: 0.010               # mean onshore-wind CF (x the wind-loss factor), absolute
      solar_cf: 0.005              # mean utility solar CF, absolute
    top_load_share_pct: [0.75, 1.25]      # sample weight of the top-1% load hours (%)
    low_net_load_share_pct: [0.5, 1.5]    # sample weight of the bottom-1% net-load hours (%)
    # net load for the low tail: solved runs (folders with dispatch_gen_annual_summary.csv), or, when
    # empty, a stylised fleet with wind and solar sized to these shares of each region's load
    low_net_load_fleets: []
    stylised_fleet: {wind_energy_share: 0.20, solar_energy_share: 0.20}
    w_min: 1.0                     # days/yr
    seed: 0
    kmeans_n_init: 20
    relax: {factor: 1.5, max_steps: 2}
    diag_dir: time_sampling        # diagnostics in <case>/time_sampling/<model year>/

  # item 2: new CC/CT capex
  gas_capex:
    # premium (S0 default): ATB 2024 Moderate x (1 + premium fraction by in-service year), with the
    #   resources.yml GridLab override neutralised. Paired paths low / central / high (the gas-turbine
    #   cap below uses the same path).
    # atb_moderate (legacy; the regression case): ATB 2024 Moderate alone (as test step B6)
    # gridlab: the resources.yml override as is (pre-S0-production behaviour)
    # Sources for the premium (Tom's review, Oct 2026): the resources.yml override values (and the
    # $1,972 / $1,547 per kW figures attributed to it) are not in the GridLab gas turbine cost report
    # (Sep 2025). Current cost evidence: BNEF, $2,157/kW for CC (2025); E3 RECOST Q1 2026, about
    # $2,500/kW CC and $1,700/kW CT for 2030 in-service; Enverus, about $2,000/kW (Sep 2026).
    mode: premium
    path: central                  # low | central | high
    # premium for capacity built in a period: mean over the period's in-service years (span_mean, the
    # averaging PowerGenome applies to ATB capex) or the value at the period's label year (period_label)
    year_basis: span_mean
    # fraction over ATB Moderate by in-service year; each key holds until the next ("0.37 to 2031"),
    # the first key also covers earlier years; applies to new-build ATB CC and CT (not CCS)
    premium_paths:
      central:
        cc: {2031: 0.37, 2032: 0.28, 2033: 0.18, 2034: 0.09, 2035: 0.0}
        ct: {2031: 0.45, 2032: 0.34, 2033: 0.23, 2034: 0.11, 2035: 0.0}
      low:
        cc: {2033: 0.50, 2034: 0.40, 2035: 0.30, 2036: 0.20, 2037: 0.10, 2038: 0.0}
        ct: {2033: 0.45, 2034: 0.36, 2035: 0.27, 2036: 0.18, 2037: 0.09, 2038: 0.0}
      high:
        cc: {2029: 0.37, 2030: 0.25, 2031: 0.12, 2032: 0.0}
        ct: {2029: 0.45, 2030: 0.30, 2031: 0.15, 2032: 0.0}

  # gas-turbine supply cap (build_rate.gas_turbine_cap in pg/settings/build_rate.yml)
  # allowance (S0 default): cumulative new CC + CT additions since 2025, turbine-weighted, against the
  #   allowance path (paired with gas_capex.path); legacy (the regression case): the cap as moved from
  #   make_emission_policies.py (451.4 GW + 9.67 GW/yr in service)
  gas_turbine_cap:
    form: allowance
    path: central

  # Coal specification rev. 2 (s0_workflow/specs/coal/coal_spec.md; s0_workflow/coal_spec.py and coal_fleet.py),
  # S0 default; off for the legacy regression case (on_pgdays), which keeps coal_cf_caps below.
  #  - zonal coal CF caps by stage from the latest EIA-860M cap units (coal_cap_units_860m.csv): coverage rule
  #    (own history if H/M >= 0.5, else blended with the national value), national value per stage;
  #  - fleet overrides on PowerGenome's unit table before clustering (latest 860M: dated retirements, removal of
  #    out-of-service units, conversions to gas steam, keep online), coal-group units exempt from the
  #    predetermined-retirement override (blocked_2030_*), so they retire in the year the spec encodes;
  #  - the order holds below (coal_holds);
  #  - checks against the spec's tables; a mismatch stops the build (fail_on_mismatch).
  # Data: python s0_workflow/scripts/fetch_coal_spec_eia.py (public EIA; writes the s0_workflow/data tables).
  coal_spec:
    enabled: true
    cap_units_table: s0_workflow/data/coal_cap_units_860m.csv
    fleet_table: s0_workflow/data/coal_fleet_860m.csv
    plant_fuel_table: s0_workflow/data/coal_plant_st_fuel.csv
    # OP and SB (coal_spec.md rev. 2.1, Tom 2026-10-04, overriding §1.1's OA): the two OA units (Biron Mill GEN1
    # 15.3 MW p76, WE Soda 5 10 MW p21) are left out
    cap_statuses: [OP, SB]
    # converted units' heat rate: the most recent year with >= 10 GWh of ST/NG (§2.3), on EIA-923 through this
    # month (YYYY-MM), or the latest data when blank (S0, Tom 2026-10-04; coal_spec.md rev. 2.1). "2025-05" gives
    # the rev. 2 values (PUDL 2025_08 vintage).
    heat_rate_data_through: ~
    # validation tables; {option} = retirements_pre2030 (s0_workflow/scripts/build_coal_option_tables.py)
    expected_caps: s0_workflow/specs/coal/by_option/coal_spec_expected_caps_by_stage.{option}.csv
    expected_overrides: s0_workflow/specs/coal/coal_spec_overrides.csv
    expected_holds: s0_workflow/specs/coal/by_option/coal_spec_hold_by_stage.{option}.csv
    tolerance: 0.001               # cap; H +-1 MW; same rule label
    fail_on_mismatch: true

  # Units held open by orders (coal_spec.md §3; with coal_spec). scenario (axis coal_holds; scenario_inputs.csv
  # column coal_holds, blank = s0):
  #   s0             Centralia 2, Campbell 1/2/3, Schahfer 17/18, Culley 2, Craig 1 held in the 2028 stage only
  #                  (encoded retirement 2029), each its own project with its hold cap, excluded from zone caps
  #   holds_persist  the same plus Intermountain 1/2 (cap 0.001), held through 2045
  coal_holds:
    enabled: true
    scenario: s0
    table: s0_workflow/data/coal_holds.csv

  # item 3 (legacy, the regression case): zonal coal CF caps (s0_workflow/data/README.md); not used with coal_spec
  coal_cf_caps:
    enabled: true
    table: s0_workflow/data/coal_cf_caps_eia923_2021_2024.csv   # s0_workflow/scripts/fetch_coal_cf_eia923.py
    min_history_mw: 500
    fallback_cf: 0.65

  # item 4: wind losses (ATB/ReEDS 13.4% against the 1.7% in the reV profiles): CF x 0.88098
  wind_loss:
    enabled: true
    factor: 0.8809766022380468     # (1 - 0.134) / (1 - 0.017)
    onshore: true                  # LandbasedWind_* and existing "Onshore Wind Turbine"
    offshore: true                 # OffShoreWind_* and existing "Offshore Wind Turbine" (windloss2)

  # state policy buyouts (rps_acp_per_mwh, study_modules.rps_regional; output rps_buyout_by_state_year.csv)
  # flat (S0 default): one buyout price on every state RPS and CES program (ESR_*, carve-outs included;
  #   54 programs in 2035 with the pinned ReEDS release, 55 with the current file), NY's RPS and CES
  #   among them
  # programs (legacy; the regression case): only the programs listed: NY RPS at NYSERDA's 2024 Tier 1
  #   ACP, $45.39/MWh, the last published (from 2025 Tier 1 is a load-share charge with no ACP);
  #   every other program a hard requirement
  #   https://www.nyserda.ny.gov/All-Programs/Clean-Energy-Standard/LSE-Obligations/2024-Compliance-Year
  rps_acp:
    enabled: true
    mode: flat
    price: 100.0                   # $/MWh
    program_prefix: ESR_
    programs: {ESR_NY_rps: 45.39}  # used by mode: programs

  # state RPS/CES targets and eligibility (Oct 2026). A ReEDS release (S0 default): the policy files
  #   built from the pinned copies of that release (pg/extra_inputs/reeds_state_policies/REEDS_RELEASE.yml)
  #   by s0_workflow/scripts/build_reeds_state_policies.py: rggi_carbon/emission_policies_reeds_<release>.csv
  #   and reeds_state_policies/s0_state_policies_<release>.yml (production.apply_state_policies)
  # legacy (the regression case): rggi_carbon/emission_policies_current.csv and the ESR tags of
  #   regional_resource_tags.yml, as every other case
  state_policies:
    release: "2026.09.21"          # ReEDS-Model/ReEDS tag 2026.09.21, commit 8a1572331da8 | legacy

  # coal and gas retirements before 2030 (axis retirements_pre2030; scenario_inputs.csv column of that name;
  # coal_spec.md rev. 2.1):
  #   block_all     (S0 default, current policy) none before 2030, economic or dated: fedpol's blocked_2030_coal_gas
  #                 predetermined override for coal and gas (a unit dated 2026-29 is in service through the 2030 stage
  #                 and first disappears from the 2035 stage), with the coal spec's dated retirements, OS removals and
  #                 the holds' encoded 2029; plus no economic retirement before 2030 (retirement_rule)
  #   planned_only  dated retirements (860M, coal spec; coal and gas) as scheduled; no economic retirement before 2030
  #   unrestricted  dated retirements as scheduled; economic retirement of coal and gas from the first stage
  #   legacy        the settings as they are, without this option (the regression case, on_pgdays)
  retirements_pre2030: block_all

  # forced (certain) transmission additions (axis forced_tx; scenario_inputs.csv column of that name; CHANGES §54):
  #   reeds_certain   (S0 default) the certain additions of the pinned ReEDS release (hvdc_planned-baseline.csv,
  #                   certain == 1: SunZia p28-p31 3,000 MW 2026, TransWest Express p24-p25 3,000 MW 2032), on ReEDS's
  #                   own transfer-capability basis; pg/extra_inputs/transmission/forced_tx_reeds_certain_<release>.csv
  #                   (s0_workflow/scripts/build_reeds_forced_tx.py)
  #   named_projects  the project list of transmission_connections.csv (new_cap_mw, 72 lines, 245,857 MW), as every
  #                   other case; for sensitivities
  forced_tx: reeds_certain
  forced_tx_release: "2026.09.21"
  # forced lines' trans_path_expansion_limit (pg_to_switch transmission_tables):
  #   minimum (S0 default) their trans_build_minimum_mw in the period they are forced, the case's rule otherwise
  #   legacy  left out of trans_path_expansion_limit.csv, so unlimited in Switch (the regression case)
  forced_tx_expansion_limit: minimum

  # planning reserve requirement (axis prm_design; scenario_inputs.csv column of that name; CHANGES §55;
  # s0_workflow/prm.py, switch/study_modules/prm_regional.py, Guides and documentation/s0_production.md):
  #   regional (S0 default) 16 reserve regions (nercr; WECC_NW by transgrp) on ~10-12 zero-weight stress days per
  #            model year; NERC 2025 LTRA margins on derated capacity; thermal at 1 - FOR(T); hydro, storage and DR at
  #            their dispatch; imports capped in every stress hour at the ReEDS 99.9th-percentile share (losses, new
  #            lines -15%); zone-level deliverability over internal lines; shortfall at the penalty below
  #   legacy   today's per-zone planning_reserves + the extreme-day block (the regression case)
  prm:
    design: regional
    config: s0_workflow/specs/prm/prm_redesign_config.yaml   # Tom's research config block (2026-10-04)
    stress_days:
      max_days: 12                 # greedy coverage stops here (the tolerance widens until it fits)
      cover_tolerance: 0.02        # a day covers a need within 2% of the region's worst value
      tolerance_step: 0.02
      max_tolerance: 0.20
      summer_months: [6, 7, 8, 9]  # summer peak-load needs
      winter_months: [12, 1, 2]    # winter peak-load needs
      first_weather_year: 2007     # PowerGenome's 7 weather years (2007-2013, 365-day years)
      diag_dir: prm                # <case>/prm/<model year>/stress_days.csv, stress_coverage.csv
    thermal_derate:
      method: seasonal             # seasonal | hourly (needs temperature_h5)
      temperature_h5: ~            # ReEDS inputs/profiles_temperature/temperature_state.h5 (repo-relative), if supplied
      temperature_tz: Etc/GMT+6    # time zone of the weather-year hours (ReEDS's convention)
      cold_c: -15                  # winter stress days: the cold end of the murphy2019 curves
      hot_c: 35                    # summer stress days: the hot end
      winter_months: [11, 12, 1, 2, 3]
      summer_months: [5, 6, 7, 8, 9]   # other months (Apr, Oct): normal-weather (static) rates
    imports:
      mode: flat                   # flat (S0) | relaxed (ReEDS 2031_hist/2050_100) | none
    new_tx_derate: 0.15            # new transmission, reserve purposes (ReEDS GSw_TransInvPRMderate)
    penalty: central               # central ($300/kW-yr, 2028$) | low ($106/kW-yr, 2025$, PJM RTO Net CONE)
    inflation_after_cpi: 0.025     # dollar-year conversion past the last CPI-U year in the repo (2024)

  # item 6: extra Switch modules on the case's scenario line (not switch/modules.txt)
  extra_modules: [study_modules.gen_amortization_period]

  # item 8 prerequisite: no economic retirement of existing coal or gas in periods before 2030,
  # economic from 2030 (study_modules.retirement_rules, added to the scenario line). With retirements_pre2030
  # block_all or planned_only it applies whatever `enabled` says; unrestricted turns it off; legacy follows `enabled`.
  retirement_rule:
    enabled: true
    no_retirement_before: 2030
    energy_sources: [coal, naturalgas]

  # no NEW capacity of these technologies (gen_tech containing the text, case-insensitive: nuclear
  # large and SMR) in periods before no_new_build_before: periods 2028 and 2030 blocked, 2035 open
  # (study_modules.build_rules, added to the scenario line). Separate from the nuclear growth cap
  # (MaxCapTag_NuclearGrowth), which counts existing nuclear too and so can leave room for new units in
  # 2028/2030 if existing plants retire. Existing and planned units are unaffected. Off for the legacy
  # regression case (on_pgdays).
  new_build_rule:
    enabled: true
    no_new_build_before: 2035
    technologies: [nuclear]

  # item 8: bounded foresight
  foresight:
    mode: myopic                   # single | myopic (mode A) | windows (mode B)
    window_periods: 2              # mode B: 2028-30, 2030-35, 2035-40, 2040-45
  # Period spans (INVESTMENT_PERIOD: first and last calendar year), the repo convention that a
  # period ends at its model year. They come from model_definition.yml (model_year /
  # model_first_planning_year); apply_settings checks they agree. How the span enters the model:
  #   costs: each year of the span is charged the period's annual costs, discounted (Switch
  #     bring_annual_costs_to_base_year); ATB capex is the mean over the span (PowerGenome)
  #   annuities: new capacity pays overnight cost x crf(interest, gen_amortization_period) each year
  #     it is in service, so a 2-year period carries two years of it
  #   build-rate limits: window W = span length; cumulative ceilings are sums of annual rates over
  #     the window; the gas-turbine cap is in-service MW at the period (cumulative form)
  period_spans:
    2028: [2026, 2028]
    2030: [2029, 2030]
    2035: [2031, 2035]
    2040: [2036, 2040]
    2045: [2041, 2045]
