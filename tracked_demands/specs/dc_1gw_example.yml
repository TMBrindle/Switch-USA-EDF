# Example spec for tracked_demands/case_writer.py: one 1 GW data centre (CHANGES §108 (g)).
# Placeholder values for a first case, not sourced: replace them before quoting results.
tracked_demands:
  - name: DC1
    type: data_center
    zone: p33                   # a ReEDS zone of the case
    max_mw: 1000
    min_mw: 1000                # flat 24/7 load
    annual_energy_share: 0.95   # requirement = share x max x 8760 MWh/yr
    connection_mw: 1000
    stress_mode: max            # max | profile | min
    curtailable_share: 0.0
    export_limit_share: 0       # no export
    connection:
      cost_multiplier: 1.0      # x ReEDS reinforcement median $/kW for the zone
      cost_share_demand: 1.0    # bill reporting only
      endogenous: false
      uses_headroom: false
    matching: {mode: hourly, target: 0.9, penalty: 200}   # hourly | annual | hour_ranges
    onsite_techs:               # private, non-fuel
      - {name: solar_onsite, energy_source: solar, capital_cost_per_mw_yr: 90000, clean: true,
         tax_credit_key: UtilityPV, max_mw: 500}
    storage: {power_cost_per_mw_yr: 30000, energy_cost_per_mwh_yr: 20000, max_hours: 8}
    # linked ordinary generators. technology: recip | diesel | aero | industrial_ct | frame_ct | cc | fuel_cell; it sets
    # the UC defaults and the gas-turbine cap category, which joins the cap only if the case's coverage includes it
    onsite_gens:
      - {name: p33_DC1_recip, technology: recip, fuel: gas, heat_rate: 8.3, overnight_cost_per_kw: 1500,
         fixed_om_per_kw_yr: 15, variable_om: 6, unit_mw: 4.5, capacity_limit_mw: 300, max_age: 25,
         uc: {min_load_fraction: 0.3, min_uptime: 0, min_downtime: 0}}   # placeholders; startup cost unset (warned)
    # backup diesel (§140, guide 16): grid_backup = 1.3 x the connection, existing, emergency only; permit 100 h/yr
    # (PLACEHOLDER; sensitivities 37, 137), test 10 h/yr; emergency_counts_toward_cap 0 = the cap limits only testing
    diesel: {config: grid_backup, tier: 2, permit_flh: 100, test_flh: 10, emergency_counts_toward_cap: 1}
    stress_grid_limit_share: 1.0   # option B: < 1 limits grid draw on stress days (the fleet carries the rest)
cap_coverage:                   # the case's CO2_PROGRAM -> tracked_demands/data/cap_coverage_rules.yml family
  "ETS 1": RGGI                # limited-export exemption off; {family: RGGI, limited_export_exemption: 1} to set it
  "ETS 2": CA
  "ETS 3": WA
# gas-turbine cap: the case's coverage is read from build_rate.gas_turbine_cap in this file (default shown), with the
# form from the case's gas_turbine_cap_params.csv (S0 production: cumulative_additions -> allowance_coverage)
# build_rate_settings: pg/settings/build_rate.yml
# gas capex premium: overnight_cost_per_kw is WITHOUT the S0 premium; the writer adds the case's premium
# (s0_production.gas_capex, checked against the case's s0_production_log.txt) by premium_class (default from technology:
# aero, industrial_ct, frame_ct -> ct; cc -> cc; others none). Per generator: premium_class: ct | cc | none, or
# premium: 0.1 (or {year: fraction}) for a sensitivity
# s0_production_settings: pg/settings/s0_production.yml
# gas_capex: {mode: atb_moderate}      # e.g. for a case built with atb_moderate (the regression row)
# gas_turbine_cap: {coverage: [combined_cycle, combustion_turbine]}   # keys over that file, if the case used others
