# Sensitivity: wind occupies half as much headroom per MW as solar (default 0.25).
# Run: python -m icsc.cli --config sensitivities/wind_050.yaml run --start-year 2026
extends: ../config.yaml
paths: {outputs: outputs/sens_wind_050}
saturation:
  tech_weights: {solar: 1.0, wind: 0.5, storage: 0.5, gas: 1.0, other: 1.0}
