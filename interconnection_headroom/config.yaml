# Interconnection network-upgrade supply curves for ReEDS zones
# All paths are relative to the project root.

dollar_year: 2024

paths:
  county2zone: data/reference/county2zone.csv          # ReEDS inputs/county2zone.csv
  hierarchy: data/reference/hierarchy.csv              # ReEDS inputs/hierarchy.csv
  reeds_queues: data/reference/reeds_interconnection_queues.csv  # ReEDS inputs/capacity_exogenous/interconnection_queues.csv
  eia860m: data/raw/august_generator2026.xlsx          # EIA-860M monthly generator inventory
  lbnl_dir: data/raw/lbnl                              # put LBNL interconnection cost .xlsx files here
  queued_up: data/LBNL_Ix_Queue_Data_File_thru2025.xlsx   # LBNL "Queued Up" (through 2025): county by queue ID
  county_crosswalk: data/reference/lbnl_county_crosswalk.csv  # LBNL county strings that are not a single county
  cpi: data/reference/cpi_u_annual.csv                 # annual CPI-U for deflating; year,cpi
  outputs: outputs

# ---------------------------------------------------------------------------
# Zone load statistics (icsc/load.py; `python -m icsc.cli load-stats` rebuilds zone_load_stats.csv)
# Raw files: data/raw/load/ (gitignored). See icsc/load.py for sources, time zones and fills.
# ---------------------------------------------------------------------------
load:
  stats: data/reference/zone_load_stats.csv          # (in cfg["load"], resolved by load_cfg)
  nrel_county_h5: data/raw/load/historic_load_hourly_2016_2023_county.h5   # data.openei.org/files/8562
  nrel_cache: data/raw/load/nrel_zone_state_hourly.pkl
  zenodo_h5: data/raw/load/demand_historic.h5                                # zenodo.org/records/18462671
  eia_state_mwh: data/reference/EIA_loadbystate.csv
  eia930_dir: data/raw/load/eia930                                           # EIA930_BALANCE_<year>_<half>.csv

# ---------------------------------------------------------------------------
# Headroom proxy and saturation
# ---------------------------------------------------------------------------
saturation:
  # Which denominator to use for saturation:
  #   transfer   = ReEDS/NARIS 2024 county-to-county AC transfer capacity inside the zone (+ share of boundary)
  #                (counts a corridor once per county pair: internal/boundary ratio tracks county count)
  #   boundary   = ReEDS/NARIS 2024 BA-to-BA export capacity, mean of the two directions, summed over interfaces
  #   boundary+peak / boundary+median / boundary+p10 = boundary + the zone's coincident peak, median
  #                or 10th-percentile hourly load in that year (zone_load_stats.csv; year-matched)
  #   generation = non-IBR nameplate online in the zone at baseline_year
  # Chosen Oct 2026: boundary (best QAIC in fit-weights; boundary+p10 is the proxy sensitivity,
  # sensitivities/boundary_p10.yaml). transfer is kept for comparison only.
  headroom_proxy: boundary
  transfer_capacity: data/reference/transmission_capacity_init_AC_county_NARIS2024.csv
  boundary_capacity: data/reference/transmission_capacity_init_AC_ba_NARIS2024.csv   # for headroom_proxy: boundary
  boundary_weight: 0.5
  # IBR additions and retirements are counted from this year onward
  baseline_year: 2010
  # Share of the network one MW of nameplate occupies under interconnection-study conditions.
  # Every new generator uses headroom; retiring ones free it at the same weight x reuse share.
  # Solar is the numeraire (1.0). Chosen Oct 2026 from fit-weights: storage 0.5 (fixed in the
  # grid), gas 1, reuse 0.1. Wind 0.25 is a physical floor: the fit's optimum is at the grid's
  # lowest value (0.1; 0.25 is 2.9 QAIC behind). Sensitivity: wind 0.5 (sensitivities/wind_050.yaml).
  #   wind < 1: deliverability studies usually credit wind's geographic diversity
  #   storage < 1: charging can relieve, not only load, the network
  #   gas = 1: a CCGT/CT injects close to nameplate at peak
  tech_weights: {solar: 1.0, wind: 0.25, storage: 0.5, gas: 1.0, other: 1.0}
  # Fraction of retired capacity assumed to free reusable headroom
  retirement_reuse_share: 0.1
  # Lower bound on headroom proxy (MW) so near-empty zones don't explode the ratio
  min_headroom_mw: 500

# ---------------------------------------------------------------------------
# LBNL interconnection cost files: map LBNL column names -> pipeline names.
# Run `python -m icsc.cli inspect-lbnl` after downloading to see the real headers,
# then edit the right-hand side. Several candidates may be listed; first match wins.
# ---------------------------------------------------------------------------
lbnl:
  sheet_hint: ["data", "project", "cost"]   # sheet name substrings to try
  header_search_rows: 10                    # header row is detected within the first N rows
  columns:
    project_id:   ["Queue ID", "Project ID", "q_id", "Request ID", "Project #", "Queue ID 1"]
    qu_id:        ["Project # in Queued Up"]   # non-ISO release: the project's ID in Queued Up
    region:       ["ISO/RTO", "Region", "Transmission Provider", "BA", "Market"]
    # transmission owner; when absent and region comes from a column (non-ISO BA), region is used
    owner:        ["Transmission Owner", "Interconnecting Transmission Owner"]
    state:        ["State", "state"]
    county:       ["County", "county"]
    fips:         ["FIPS", "County FIPS", "fips"]
    tech:         ["Fuel", "Technology", "Type", "Resource Type", "Fuel Type"]
    capacity_mw:  ["Nameplate Capacity (MW)", "Capacity (MW)", "MW", "Size (MW)", "Nameplate MW"]
    # LBNL releases give a queue date (SPP: year only); the pipeline keeps the year
    queue_year:   ["Queue Year", "Request Year", "Year of Request", "q_year", "Queue Date"]
    status:       ["Request Status", "Status", "Queue Status"]
    service:      ["Service Type", "Interconnection Service", "NRIS/ERIS"]
    # Dollar year of the cost columns. Not "Study Year": LBNL costs are already in constant dollars.
    cost_year:    ["Cost Year", "Dollar Year"]
    poi_cost:     ["POI Cost ($/kW)", "POI Cost", "Interconnection Facility Cost ($/kW)", "POI ($/kW)",
                   "$2022 POI Cost/kW", "$2024 POI Cost/kW", "Real POI/kW"]
    network_cost: ["Network Upgrade Cost ($/kW)", "Network Cost ($/kW)", "Network ($/kW)", "Network Upgrades ($/kW)",
                   "$2022 Network Cost/kW", "$2024 Network Cost/kW", "Real Network/kW"]
    total_cost:   ["Total Cost ($/kW)", "Total ($/kW)", "Total Interconnection Cost ($/kW)",
                   "$2022 Total Cost/kW", "$2024 Total Cost/kW", "Real Total/kW"]
  # Dollar year of each workbook's costs (by file name), used when there is no cost_year column.
  # Source: each workbook's codebook / headers. MISO, PJM, SPP, ISO-NE, NYISO: "real $2022/kW"
  # (GDP deflator); non-ISO BAs (Feb 2026 release): "$2024 ... Cost/kW" headers.
  # A "$YYYY" prefix in a cost header that disagrees with this is an error.
  cost_dollar_year: {MISO: 2022, PJM: 2022, SPP: 2022, ISONE: 2022, NYISO: 2022, NonISO: 2024}
  # If costs are given in $ (not $/kW), set to true and the pipeline divides by capacity*1000
  costs_are_total_dollars: false
  # Locating projects (icsc/linkage.py). Cost-file region (file name, or the BA column) -> the
  # Queued Up rows its queue IDs are matched against ({region: ...} or {entity: ...}); the state
  # must also agree. Queued Up regions/entities are listed on its "01. Balancing Areas" sheet.
  queued_up_sheet: "03. Complete Queue Data"
  queued_up_scope: {MISO: {region: MISO}, PJM: {region: PJM}, SPP: {region: SPP}, ISONE: {region: ISO-NE},
                    NYISO: {region: NYISO}, BPA: {entity: BPA}, PAC: {entity: PacifiCorp},
                    DEC: {entity: Duke}, DEP: {entity: Duke}, DEF: {entity: Duke}}
  # Queued Up FIPS codes retired by the Census Bureau -> current code
  fips_recode: {"46113": "46102"}   # Shannon County SD renamed Oglala Lakota County, 2015 (Census Bureau)
  # Service values treated as ERIS besides the built-in patterns (exact, case-insensitive).
  # ISO-NE "NR" (Network Resource, vs CNR Capacity Network Resource) stays NRIS by default;
  # set ["NR"] for the sensitivity.
  service_eris_extra: []
  min_mw_share: 0.85    # link-report flags a workbook with less than this share of MW placed
  status_map:   # normalised status values
    active: ["active"]
    completed: ["complete", "operational", "in service", "done"]   # "complete" also matches "completed"
    withdrawn: ["withdrawn", "suspended", "cancelled", "canceled"]
  tech_map:
    solar: ["solar", "pv"]
    wind: ["wind"]
    storage: ["storage", "battery"]
    hybrid: ["hybrid", "+"]
    gas: ["gas", "ng", "combustion", "combined cycle"]
    other: ["biogas"]   # matched before gas; not in estimation.techs, so excluded from the sample

# ---------------------------------------------------------------------------
# Estimation
# ---------------------------------------------------------------------------
estimation:
  sample_statuses: ["active", "completed"]   # central case; add "withdrawn" for a high-cost sensitivity
  techs: ["solar", "wind", "storage", "hybrid", "gas"]
  winsorize_pct: 0.99            # cap extreme $/kW values
  min_capacity_mw: 5
  exclude_offshore_wind: true    # offshore projects (no onshore county; export cable costs) stay in lbnl_projects_clean, flagged
  # Dependent variable: log(1 + network $/kW). Saturation enters as a linear spline with these knots.
  saturation_knots: [0.25, 0.5, 1.0]
  min_obs_above_knot: 50         # drop knots with too few projects above them
  support_quantile: 0.98         # beyond this saturation the last spline slope is extended (never negative)
  estimator: ppml               # ppml (Poisson PML on $/kW, default) or log_ols (log(1 + $/kW), Duan smearing)
  status_term: true              # dummy for completed (vs active) projects
  # Regimes with at least this many completed projects in the sample get their own completed effect;
  # the rest (ISO-NE, DEC, DEP, BPA on the Oct 2026 sample) share one pooled completed effect.
  status_by_regime_min: 25
  regime_column: region          # planning-regime fixed effect (ISO/RTO or utility)
  cluster_column: ba_cluster     # cluster-robust SEs by ReEDS zone (largest candidate zone for owner_multi rows)

# Grid for `fit-weights` (solar is the numeraire; other categories searched over these values)
weight_search:
  proxies: [boundary+peak, boundary+median, boundary+p10, boundary, generation, transfer]  # transfer: comparison only
  solar: [1.0]
  wind: [0.1, 0.15, 0.25, 0.5, 0.75, 1.0]
  storage: [0.5]
  gas: [0.0, 0.5, 1.0]
  other: [1.0]
  reuse_share: [0.0, 0.1, 0.25, 0.5]

# ---------------------------------------------------------------------------
# Tranche generation
# ---------------------------------------------------------------------------
tranches:
  # Empirical steps run from each zone's start saturation to the sample's support edge
  # (estimation.support_quantile of sample saturation) in equal steps of about step_width.
  # Zones already beyond the edge get one step of edge_step_width priced at the edge.
  step_width: 0.015
  edge_step_width: 0.05
  reference_tech: solar
  reference_capacity_mw: 150
  reference_service: NRIS
  reference_status: completed    # status the reference curves are priced at; "active" for the sensitivity
  # How the reference status effect is priced in each zone (estimation.status_by_regime_min gives
  # regimes with >= 25 completed projects their own completed effect; the rest share a pooled one):
  #   own     the zone's regime effect as estimated (NYISO x3.6, PJM x0.42, PacifiCorp x0.24 vs active)
  #   capped  the regime effect bounded to within status_cap_ratio x the pooled effect (multiplicative)
  #   pooled  every zone at the pooled effect
  # Default capped (Oct 2026): the regime-level completed effects rest on 28-307 completed projects
  # each (NYISO 28, PacifiCorp 67) and span x15 between regimes (NYISO x3.6 vs PacifiCorp x0.24),
  # against a pooled effect of x0.93 (s.e. 0.46); capping keeps each effect's direction relative to
  # the pooled one while bounding it to x0.5-2. pooled is the sensitivity
  # (sensitivities/status_pooled.yaml).
  status_pricing: capped
  status_cap_ratio: [0.5, 2.0]
  # log_ols only: smearing correction when back-transforming from log space (Duan); false = median
  duan_smearing: true
  # Upper bound on $/kW for the final tranche (anything above is treated as not buildable)
  max_cost_per_kw: 1500
  # Year used for the time-trend term when predicting. With trend_freeze: per_regime (default) each
  # zone uses min(reference_year, the last queue year of its regime's estimation sample; zones whose
  # regime has no projects use the sample's last year), so curves never extrapolate the queue-year
  # trend (+0.115 log points/yr, x1.12/yr) past a regime's data. Why (Oct 2026 sample): the ISO
  # workbooks end in queue year 2020 (ISO-NE 2021) and only the non-ISO release reaches 2023; only 8
  # completed projects were queued after 2021 (all Duke Energy Florida, FRCC) and 3 in 2021; and the
  # unfrozen trend moves completed-project costs x2.9 between the sample's mean queue year (2013)
  # and 2024. trend_freeze: none evaluates every zone at reference_year (previous default).
  reference_year: 2024
  trend_freeze: per_regime

# ---------------------------------------------------------------------------
# Network uprate options: MW Switch may add in a zone. GETs and reconductoring raise the capacity of
# the existing network H (stretch mode: raise H, release s0 x MW, stretch the steps); their caps and
# first years come from the adoption level below (uprate_levels), their costs from the sources here.
# new_line hosts generation directly (new_line_mode: host) at full new-build cost (ReEDS reinforcement / 0.5).
#
# Cost forms (cost_per_kw): a number ($ per kW of network H); {per_kw_gen: x} ($ per kW of generation
# enabled, converted to $ per kW of H with reinforcement.per_mw_h, curve_end by default);
# {reeds_reinforcement_x: f} (f x the zone's ReEDS reinforcement cost per kW of generation, converted
# the same way; in host mode, per kW of generation hosted, not converted); reeds_reinforcement (= f 1.0).
#
# Sources (page numbers are PDF pages; copies of [LO24] and [BR21] in data/reference/sources/):
#  [LO24]   US DOE, "Pathways to Commercial Liftoff: Innovative Grid Deployment", May 2024 (Final_5.2-1).
#           Appendix F (p. 88): technical and economic potential if deployed overnight, national averages.
#           DLR: 742 GW peak x 97% technically feasible x 99.5% x 50% of lines operating above 75% of
#           rating x 99% "system where DLR is not used today" x 95% x 99% x 95% = 317 GW applicable;
#           capacity increase min 6% / average 25% / max 44%; ~80 GW mid case. APFC: 50% of lines viable;
#           +10 / 17 / 25%. Topology optimisation: 90% viable; +3 / 8 / 12%. Advanced conductors: ~15% of
#           US lines reconductored (20% that could be (INL) x 80% with structure life left); 1.7x / 2x / 3x.
#           Estimates are for each technology "installed individually" (p. 30); combined potential is not
#           given. Costs: DLR "at less than five percent of the cost of rebuilding the line" (p. 10); DLR and
#           APFC in a DOE New York study "cost less than 25% of traditional upgrades"; PPL DLR < $1M on two
#           lines vs reconductor/rebuild at $0.5-4M/mile, ~$13-68M; reconductoring with advanced conductors
#           "less than half the price of a new build"; advanced conductors 1.5-2x the cost of conventional
#           conductors (p. 25); APFC "typically less than 15-25% of the cost of a conventional upgrade" (p. 45
#           n. 52). Deployment today: transmission GETs "particularly limited utility interest at scale";
#           advanced conductors "a niche choice" (p. 39); case examples PPL DLR (2023, ~20% capacity on normal
#           ratings), Georgia Power 33 APFC units, Great River Energy 52 DLR sensors, Dominion $33.7M GRIP DLR
#           grant (p. 41, 82-84); no national inventory of deployed capacity.
#  [BR21]   Tsuchida, Ross, Bigelow (Brattle) for the WATT Coalition, "Unlocking the Queue with Grid-Enhancing
#           Technologies: Case Study of the Southwest Power Pool", 1 Feb 2021. SPP (Kansas, Oklahoma, 2025):
#           GETs combined (DLR on 56 lines, APFC at 8 locations, 204 topology reconfigurations) raise
#           renewables integrated from 2,580 to 5,250 MW, +2,670 MW (p. 9-10, 13); installation ~$90 million,
#           ongoing ~$10 million a year (p. 10, 13); DLR 5-25% above static ratings (DOE/Oncor, p. 19). One
#           region's result, not a national value.
#  [RMI24]  Siegner, Toth, Teplin, Mulvaney, "GETting Interconnected in PJM", RMI, Feb 2024. PJM queue
#           study (IL, IN, OH, PA, VA; summer 2026 peak case): GETs combined enable 6.6 GW (Exhibit ES1,
#           p. 6) at $0.1 billion installation cost (p. 21); DLR summer rating +17% average, up to 30%,
#           modelled at 10% (p. 13); DLR data within three months of installation (Exhibit 5, p. 16).
#  [GL24T]  Chojkiewicz et al., 2035 Report reconductoring technical report, UC Berkeley / GridLab, 2024.
#           Figure 5 (p. 20): GETs incl. DLR 3+ months, 10-30%; FACTS 8-18 months, 30-50%; reconductoring
#           18-36 months, 50-110%. ACCC thermal limit 2x ACSR (p. 49); ~98% of the ~53,000 lines >= 100 kV
#           are < 50 miles and can be doubled (p. 50); reconductoring "less than half—if not a third or even a
#           fourth" of new build for similar capacity (p. 6, 31).
#  [GL24P]  O'Boyle, Baker, Solomon, GridLab policy report, 9 Apr 2024: 18 to 36 months (p. 8).
#  [ReEDS]  ReEDS docs at the pinned commit: reinforcement priced at greenfield CAPEX x 0.5 for reconductoring.
#
# GETs cost per kW of generation enabled, by region where a study exists: PJM $15.2 = [RMI24] $0.1 billion
#   / 6.6 GW; SPP $33.7 = [BR21] $90 million / 2,670 MW. Other regions: MISSING (no study); they take the
#   SPP value (the higher of the two), not an estimate. [LO24] bounds GETs at < 25% of a traditional upgrade
#   (p. 25), consistent with both. O&M ([BR21] ~$10 million a year) is not modelled (uprates carry capital
#   cost only). Dollar years: not stated in [RMI24] or [BR21] (MISSING); used without conversion.
# Reconductoring vs new lines. ReEDS's cost_reinforcement is already a reconductoring cost: "A cost for each
#   reinforcement route is calculated using the cost surface described above, with capital expenditure
#   (CAPEX) costs multiplied by 50% to approximate the lower cost for reconductoring compared to greenfield
#   transmission construction" (ReEDS docs/source/model_documentation.md, "Network reinforcement", line
#   1809, pinned commit 2f583ff5). So:
#   reconductoring = 1.0 x the zone's ReEDS reinforcement cost per kW of generation (consistent with
#     [GL24T] and [LO24] p. 25, "less than half the price of a new build"; [GL24T] gives no $/MW figure in
#     its text, so its own number is MISSING); 0.5 x in sensitivities/reconductor_low_cost.yaml ("a fourth");
#   new_line (host mode) = ReEDS reinforcement / 0.5 = 2.0 x: the full new-build cost the 50% factor removed.
uprate_options:
  gets:        {type: gets, cost_per_kw: {per_kw_gen: 33.7, per_kw_gen_by_transreg: {PJM: 15.2, SPP: 33.7}}}
  reconductor: {type: reconductor, cost_per_kw: {reeds_reinforcement_x: 1.0}}
  # new_line: 2.0 x the zone-level ReEDS reinforcement cost (reinforcement block below: capacity-weighted
  # median of the zone's reV sites, pipeline dollar year), i.e. full new build (see above). share_of_capacity is a
  # finite numerical bound for the LP, not a physical limit: as the backstop beyond the data's support
  # edge it should not bind (was 1.0 x base capacity, which could bind in high-build runs).
  new_line:    {type: new_line,    share_of_capacity: 10.0, cost_per_kw: {reeds_reinforcement_x: 2.0}, available_year: 2030}

# Adoption limits by level (share_of_capacity = MW of H the option may add / H0; available_year = first
# build year). Technical potential share = applicable share x capacity increase ([LO24] Appendix F, p. 88).
#   s0 (S0; the default level, used by reference and atts_s0): observed deployment. [LO24] p. 88 assumes DLR is "not used today"
#     on 99% of the system, i.e. in use on 1%: 1% x 25% average increase = 0.25% of H0. APFC and topology
#     optimisation in use today: MISSING (only "particularly limited utility interest at scale", p. 39).
#     Advanced conductors in use today: MISSING ("a niche choice", p. 39): 0. Committed projects (Dominion
#     GRIP DLR, Great River Energy, p. 41): capacity not given, MISSING. Why it is small: Order No. 1920
#     (89 FR 49280) requires consideration of DLR, APFC, advanced conductors and switching (P 1198) but not
#     deployment (P 1200); Order No. 881 (87 FR 2244) requires ambient-adjusted ratings only for near-term
#     service (P 4), seasonal ratings for longer-term service (P 5, P 201), not in transmission planning
#     (P 203, P 347), and does not mandate DLR (P 8); implementation due 12 July 2025 (P 12, P 360-361).
#   s0_mandate_only (sensitivity): only what the orders require for planning-horizon ratings: 0.
#   planned: technical and economic potential, mid case ([LO24] p. 88): GETs = DLR 317/742 GW applicable
#     x 25% = 10.7% of H0 (largest single GET; APFC 50% x 17% = 8.5%, TO 90% x 8% = 7.2%; combined not
#     given, MISSING); reconductoring = 15% of lines x (2x - 1) = 15%. Timing: Order 1920 effective 12 Aug
#     2024, compliance within ten months (P 12), first Long-Term Regional Transmission Planning cycle no
#     later than a year after (P 1072), plus lead time: GETs up to 18 months -> 2028; reconductoring 18-36
#     months -> 2029.
#   reform: near technical potential: GETs = DLR 42.7% applicable x 44% maximum = 18.8% ([LO24] p. 88);
#     reconductoring = [LO24]'s high case, ~15% of lines (20% reconductorable, INL, x 80% with structure
#     life left) at 3x: 15% x (3 - 1) = 30% ([LO24] p. 88). Lead time alone from 2026: GETs 2027,
#     reconductoring 2028.
#   reform_techmax (sensitivity, scenario atts_reform_techmax): reconductoring at [GL24T]'s line share,
#     98% of lines < 50 miles (p. 50) x 80% with structure life ([LO24] p. 88) x (2x - 1) = 78%.
#     The sources disagree on how much of the network can be reconductored: [LO24] takes 20% of lines
#     (from INL), [GL24T] the ~98% of lines short enough to be thermally limited; neither reconciles
#     with the other. reform uses [LO24] (the more conservative, and the one with a structure-life screen).
uprate_level: s0             # default: current-trajectory baseline; planned / reform only when a scenario selects them
uprate_levels:
  s0:
    gets:        {share_of_capacity: 0.0025, available_year: 2026}   # 1% of system x 25% [LO24 p. 88]
    reconductor: {share_of_capacity: 0.0,    available_year: 2026}   # deployed share MISSING [LO24 p. 39]
  s0_mandate_only:
    gets:        {share_of_capacity: 0.0, available_year: 2026}
    reconductor: {share_of_capacity: 0.0, available_year: 2026}
  planned:
    gets:        {share_of_capacity: 0.107, available_year: 2028}    # 317/742 x 25% [LO24 p. 88]
    reconductor: {share_of_capacity: 0.15,  available_year: 2029}    # 15% x (2x - 1) [LO24 p. 88]
  reform:
    gets:        {share_of_capacity: 0.188, available_year: 2027}    # 317/742 x 44% [LO24 p. 88]
    reconductor: {share_of_capacity: 0.30,  available_year: 2028}    # 15% x (3x - 1) [LO24 p. 88 high case]
  reform_techmax:                                                     # sensitivity: GridLab line share
    gets:        {share_of_capacity: 0.188, available_year: 2027}
    reconductor: {share_of_capacity: 0.784, available_year: 2028}    # 98% [GL24T p. 50] x 80% [LO24 p. 88] x 1

# ReEDS reinforcement cost by zone (icsc/reinforcement.py; `python -m icsc.cli reinforcement`
# rebuilds zone_table from the raw ReEDS files fetched by scripts/fetch_data.sh)
reinforcement:
  h5: data/raw/reeds/interconnection_land.h5
  supply_curves: [data/raw/reeds/supplycurve_upv-reference.csv, data/raw/reeds/supplycurve_wind-ons-reference.csv]
  zone_table: data/reference/reeds_reinforcement_by_zone.csv
  quantile: median            # median | p10 | p90: which zone statistic prices new_line
  # Unit conversion for stretch-mode options priced per kW of generation (GETs, reconductoring, and
  # new_line when new_line_mode: stretch; host mode prices per MW of generation hosted, x 1).
  # ReEDS's cost is $ per MW(AC) of generation: it reinforces one MW of route capacity
  # (POI -> zone centre) per MW of new wind/solar (ReEDS docs "Network reinforcement"; output_calc
  # reinforcement GW-mi = new GW x distance). new_line's cost is per MW of network capacity H, and one
  # MW of H hosts more or less than one MW of (weighted) generation depending on saturation. So
  # $/MW-H = ReEDS $/MW-gen x gen MW hosted per MW of H:
  #   curve_end (default, recommended): x the zone's curve-end saturation (release s0 + stretch to the
  #       end), so a MW of generation hosted through new_line costs ReEDS's $/MW, wherever the zone is
  #   s0: x start saturation (release only); near-free H in low-saturation zones (median s0 0.15)
  #   gen: x 1, ReEDS's route MW taken as H MW; overprices generation hosted where saturation < 1
  per_mw_h: curve_end

# Engineering cost of network capacity added by reactive (generator-paid) upgrades, $/kW of
# network. Used only to REPORT an estimate of capacity added along the empirical curve
# (ic_network.csv reactive_mw_added_est). PLACEHOLDER.
reactive_cost_per_kw_network: 150

# ---------------------------------------------------------------------------
# Policy scenarios. Levers:
#   regime_override: best   height: every zone gets the lowest-cost regime effect
#   cost_multiplier: x      height: scale every step's $/kW
#   slope_multiplier: m     steepness: scale the rise above the first step (log space)
#   uprates: [...]          network capacity Switch may build (stretches the curve and moves
#                           zones back down it); options from uprate_options
# backstop_uprates are available in every scenario, including reference: beyond the empirical
# curve (the data's support edge), headroom comes only from building network capacity.
# ---------------------------------------------------------------------------
backstop_uprates: [new_line]   # full new-build cost (ReEDS reinforcement / 0.5); available_year is a placeholder
# GETs and reconductoring are offered in every scenario at the scenario's uprate_level (default s0)
baseline_uprates: [gets, reconductor]
# How new lines provide headroom (Switch ic_uprate_mode):
#   host (default): a new line hosts generation directly: each MW adds one weighted MW to the zone's
#     headroom limit at its cost per MW of generation (full new build, 2.0 x ReEDS reinforcement; no unit
#     conversion), with no empirical step or release cost on top. That cost covers delivering a MW of new
#     generation to the zone centre, so charging the LBNL step costs as well would count network
#     upgrades twice. H, the steps and the release are untouched. share_of_capacity caps hosted MW.
#   stretch (previous behaviour): a new line adds MW to H like GETs and reconductoring (stretches the
#     steps, releases s0 x MW), priced per MW of H with reinforcement.per_mw_h.
# GETs and reconductoring always stretch: they raise the capacity of the existing network.
new_line_mode: host

scenarios:
  # Every scenario gets baseline_uprates (GETs, reconductoring) at its uprate_level (default s0:
  # observed deployment) and backstop_uprates (new_line). reference = atts_s0: the current-trajectory
  # baseline used by S0 cases (the pg_to_switch "on" setting names reference).
  reference:
    description: Empirical curve; GETs and reconductoring at observed deployment (s0); new-line backstop.
  atts_s0:
    description: Same as reference (current-trajectory baseline; Liftoff Appendix F).
    uprate_level: s0
  best_regime:
    description: Every zone gets the planning-regime effect of the lowest-cost regime; slope unchanged; s0 uprates.
    regime_override: best
  atts_s0_mandate_only:
    description: "GETs and reconductoring at what Orders 881 and 1920 require for planning (caps 0)."
    uprate_level: s0_mandate_only
  atts_planned:
    description: GETs and reconductoring at Liftoff's mid-case technical and economic potential (Order 1920 timeline).
    uprate_level: planned
  atts_reform:
    description: GETs at Liftoff's maximum and reconductoring at Liftoff's high case (30%), after lead time.
    uprate_level: reform
  atts_reform_techmax:
    description: As atts_reform, with reconductoring at GridLab's line share (98% x 80% structure life = 78%).
    uprate_level: reform_techmax
  proactive_planning:
    description: Planned-level uprates, and a flatter curve from right-sized portfolio upgrades (placeholder multiplier).
    uprate_level: planned
    slope_multiplier: 0.7
# ---------------------------------------------------------------------------
# Planning regimes: harmonise LBNL region labels and ReEDS transreg names to one label set
# ---------------------------------------------------------------------------
regimes:
  # LBNL region (file name, or the non-ISO BA column) -> regime. Applied in lbnl.clean, so run and
  # fit-weights see the same labels. Non-ISO utilities get their own effect; Duke Energy Florida
  # (DEF) is pooled into FRCC.
  lbnl_to_regime: {"ISO-NE": ISONE, "ISO New England": ISONE, "NYISO": NYISO, "PJM": PJM, "MISO": MISO,
                   "SPP": SPP, "CAISO": CAISO, "ERCOT": ERCOT,
                   "BPA": BPA, "PAC": PacifiCorp, "DEC": DEC, "DEP": DEP, "DEF": FRCC}
  # Zones whose hierarchy.csv hurdlereg is one of these utilities take that utility's effect
  # (BPA: p2 p5 p7; PacifiCorp: p6 p8 p21 p22 p25 p26; DEC: p95 p97; DEP: p98); other zones take
  # their transreg's effect (through transreg_to_regime), or the mean if it has no projects.
  hurdlereg_to_regime: {Bonneville_Power_Administration: BPA, PacifiCorp_West: PacifiCorp,
                        PacifiCorp_East: PacifiCorp, Duke_Energy_Carolinas_LLC: DEC,
                        Duke_Energy_Progress_East: DEP}
  transreg_to_regime: {}

# ---------------------------------------------------------------------------
# Switch export
# ---------------------------------------------------------------------------
switch:
  asset_life_years: 40
  # gen_energy_source / gen_tech values in the Switch inputs -> weight category above.
  # Written to ic_weights.csv. CHECK these against Switch-USA-PG gen_info.csv before use.
  weight_keys:
    Solar: solar
    Wind: wind
    Naturalgas: gas
    NaturalGas: gas
    naturalgas: gas
    Gas: gas
  default_weight_category: other   # any new build whose source/tech isn't listed
  zone_map: null              # CSV with columns ba,load_zone if Switch zones are aggregations of ReEDS BAs
