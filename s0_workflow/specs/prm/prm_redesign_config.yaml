# Switch-USA-PG-ReEDS — planning reserve redesign inputs
# Compiled 2026-10-04. Fractions unless stated. Tags:
#   [src]  value read from the cited source
#   [inf]  inference / design choice by the compiler — not a published number
#   [nc]   cited but not confirmed against the primary table (secondary or summarised fetch)
# Region key = ReEDS `nercr` (inputs/hierarchy.csv, ReEDS-2.0 main @ 2026-04-22).
# (Committed verbatim from Tom's research config, 2026-10-04; read by s0_workflow/prm.py. CHANGES §55.)

sources:
  ltra2025: "NERC 2025 LTRA, Table 2 (pp.14-15), released 2026-01-29 — https://prod.nerc.com/globalassets/our-work/assessments/nerc_ltra_2025.pdf"
  reeds_hier: "ReEDS-2.0 inputs/hierarchy.csv, main 2026-04-22 — https://github.com/NREL/ReEDS-2.0/blob/main/inputs/hierarchy.csv"
  reeds_imports: "ReEDS-2.0 inputs/reserves/peak_net_imports.csv (99.9th pct coincident net imports 2019-23) — https://github.com/NREL/ReEDS-2.0/blob/main/inputs/reserves/peak_net_imports.csv"
  reeds_for: "ReEDS-2.0 inputs/plant_characteristics/outage_forced_temperature_murphy2019.csv (Murphy et al. 2019, doi:10.1016/j.apenergy.2019.113513)"
  pjm_elcc_2930: "PJM ELCC class ratings, 2029/30 BRA (posted with params 2026-08-31) — https://www.pjm.com/-/media/DotCom/planning/res-adeq/elcc/29-30-bra-elcc-class-ratings.pdf"
  pjm_fpr_2930: "PJM MC 2026-08-19, 2029/30 IRM/FPR — https://www.pjm.com/-/media/DotCom/committees-groups/committees/mc/2026/20260819/20260819-item-05---2029-2030-bra-irm-fpr---presentation.pdf"
  nyiso_caf: "NYISO final CAFs 2026/27, 2026-02-17 — https://www.nyiso.com/documents/20142/41593818/Final-Capacity-Accreditation-Factors-for-the-2026-2027-capability-year.pdf"
  isone_prelim: "ISO-NE CAR-SA impact analysis (preliminary), Mar 2026 — https://www.iso-ne.com/static-assets/documents/100033/a07.1.h_mc_rc_2026_03_10-12_car-sa_ia_ram.pdf"
  spp_elcc: "SPP 2024 ELCC report (final draft 2024-09-10) — https://www.spp.org/documents/72346/2024%20spp%20elcc%20wind%20solar%20&%20esr%20report.pdf"
  spp_prm: "SPP PRM recommendation 2025-04-04 — https://www.spp.org/documents/73589/prm%20recommendation%204-4-25.pdf"
  miso_pra: "MISO status update to MO PSC, 2026-05-28 — https://psc.mo.gov/CMSInternetData/Agenda%20Presentations/2026%20Presentations/5-28-26%20MISO%20Status%20Update.pdf"
  cpuc_prm: "CPUC D.25-06-048 fact sheet, 2025-06-27 — https://www.cpuc.ca.gov/-/media/cpuc-website/divisions/energy-division/documents/resource-adequacy-homepage/oga-fact-sheet-on-track-3-decision-final.pdf"

prm:
  default_rule: "2028-2029: linear between LTRA 2026 and 2030 RML; 2030-2045: hold 2030 RML flat"  # [inf]
  regions:
    MISO:      {ltra_area: MISO,            rml_2026: 0.081, rml_2030: 0.085, season: summer, alt: "MISO 2026/27 PRA targets (UCAP): summer 0.079, winter 0.189 [src miso_pra]"}
    SPP:       {ltra_area: MRO-SPP,         rml_2026: 0.190, rml_2030: 0.190, season: summer, alt: "SPP own PRM 0.16 summer / 0.36 winter from 2026; 0.17 / 0.38 from 2029 [src spp_prm]"}
    PJM:       {ltra_area: PJM,             rml_2026: 0.186, rml_2030: 0.263, season: summer, alt: "PJM IRM 0.204 (ICAP), FPR 0.9232 (UCAP) for 2029/30 [src pjm_fpr_2930]"}
    ERCOT:     {ltra_area: Texas RE-ERCOT,  rml_2026: 0.1375, rml_2030: 0.1375, season: summer, note: "ERCOT has no PRM requirement; 13.75% is the PUCT/ERCOT reliability-study value [nc]"}
    NPCC_NY:   {ltra_area: NPCC-New York,   rml_2026: 0.150, rml_2030: 0.150, season: summer, alt: "NYSRC 2026/27 base-case IRM 0.253 (adopted value nc)"}
    NPCC_NE:   {ltra_area: NPCC-New England, rml_2026: 0.134, rml_2030: 0.130, season: summer}
    SERC_C:    {ltra_area: SERC-Central,    rml_2026: 0.150, rml_2030: 0.150, season: summer, alt: "TVA draft 2026 IRP: 0.26 winter / 0.18 summer [nc, Utility Dive]"}
    SERC_E:    {ltra_area: SERC-East,       rml_2026: 0.150, rml_2030: 0.150, season: summer, alt: "Duke 0.22 winter [nc]"}
    SERC_SE:   {ltra_area: SERC-Southeast,  rml_2026: 0.150, rml_2030: 0.150, season: summer, alt: "Georgia Power 2025 IRP: 0.26 winter / 0.20 summer [src GPC docket overview]"}
    SERC_F:    {ltra_area: SERC-Florida Peninsula, rml_2026: 0.150, rml_2030: 0.150, season: summer, alt: "FL IOUs plan to 0.20 [nc]"}
    WECC_CA:   {ltra_area: WECC-California, rml_2026: 0.203, rml_2030: 0.193, season: summer, alt: "CPUC PRM 0.18 for 2026-27, ~0.225 effective Jun-Oct [src cpuc_prm]"}
    WECC_SW:   {ltra_area: WECC-Southwest,  rml_2026: 0.133, rml_2030: 0.122, season: summer}
    WECC_NW:   # ReEDS lumps three LTRA areas; set PRM at transgrp level to separate them [inf mapping]
      by_transgrp:
        NorthernGrid_West:  {ltra_area: WECC-Northwest (winter-peaking), rml_2026: 0.178, rml_2030: 0.155}
        NorthernGrid_South: {ltra_area: WECC-Basin,          rml_2026: 0.135, rml_2030: 0.123}
        NorthernGrid_East:  {ltra_area: "WECC-Northwest/Basin (ID, MT, WY) — ambiguous", rml_2026: 0.135, rml_2030: 0.123, note: "[inf] Basin used; check"}
        WestConnect_North:  {ltra_area: WECC-Rocky Mountain, rml_2026: 0.178, rml_2030: 0.157}

